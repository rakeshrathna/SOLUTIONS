# ============================================================
# EDUIDEAL POSTGRESQL BACKEND CONFIGURATION
# ============================================================

server.port=${PORT:${SERVER_PORT:8080}}

# PostgreSQL Database Connection (Supports Railway, Docker, Localhost & .env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:${PGHOST:postgres.railway.internal}}:${DB_PORT:${PGPORT:5432}}/${DB_NAME:${PGDATABASE:railway}}}
spring.datasource.username=${DB_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Jackson Config
spring.jackson.serialization.fail-on-empty-beans=false

# App JWT Secret
app.jwt.secret=${JWT_SECRET:LearnovaEduidealPostgresqlSecretKey2026SecureTokenKey998877665544332211}
app.jwt.expiration-ms=86400000
